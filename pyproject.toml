[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volterra-options"
version = "0.1.0"
description = "Mathematical-finance engine for risk-neutral derivative pricing, Greeks, optimal stopping, Monte Carlo, and implied volatility"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
volterra = ["py.typed"]
